[project]
name = "kanidashi"
dynamic = ["version"]
description = "Dashi on steroids powered by rust"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "The dashi developers", email = "achim.stoessl@gmail.com" },
]
license         = { text = "GPLV3" }
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
  "Jinja2>=2.7.3",
  "MarkupSafe>=0.23",
  "Pygments>=2.0.2",
  "Sphinx>=1.2.3",
  "docutils>=0.12",
  "matplotlib>=3.0.0",
  "mock>=1.0.1",
  "nose>=1.3.4",
  "numpy>=2.0.0",
  "pyparsing>=2.0.3",
  "python-dateutil>=2.4.0",
  "pytz>=2014.10",
  "scipy>=0.15.1",
  "six>=1.9.0",
]

[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
#features      = ["random","database","advanced-algorithms","pybindings","tof-liftof"]
module-name   = "kanidashi.kanidashi_core"
python-source = "python"

[project.urls]
Repository = "https://github.com/achim1/dashi" 
#Documentation = "https://gaps-collab.github.io/gaps-online-software/" 
Homepage = "https://github.com/emiddell/dashi"

