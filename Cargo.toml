[package]
name = "kanidashi-core"
version = "2.0.2"
edition = "2024"

[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import string_sum`). If you change this, you must also change the name of the
# `#[pymodule]` in `src/lib.rs`.
name = "kanidashi_core"
path = "src/lib.rs"
# FIXME - make this conditional?
crate-type = ["cdylib", "lib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bench]]
name = "bench"
harness = false
required-features = ["random"]

[[test]]
name = "test"
required-features  = ["random"]

#[features]
## create structures with random data for testing
#random              = ["rand"]
## requires sqlite, but allows to get geometry information 
## as well as calibration for the tracker
#database            = ["diesel"]
## define the default features for easy testing 
#default             = ["random", "database", "tof-liftof"]


[dependencies.pyo3]
version  = "0.26"
features = ["extension-module", "multiple-pymethods", "abi3-py311", "chrono"]

[dependencies.pyo3-log]
version = "0.13"

[dependencies.numpy]
version = "0.26"

#[dependencies.serde-pickle]
#version = "1.1"

[dev-dependencies]
criterion = "0.4"
#tempfile  = "3.10"
quickcheck = "1"

[dependencies]
#similar           = "2"
#comfy-table       = "7.1"
strum             = "0.27"
strum_macros      = "0.27"
num-traits        = "0.2"
statrs            = "0.18"
half              = { version = "2.6", features=["num-traits"]}
chrono            = "0.4"
regex             = "1.5"
glob              = "0.3"
log               = "0.4"
#serde             = { version = "1.0", features = ["derive"] }
#serde_json        = "1.0"
crc               = "3.0"
cfg-if            = "1.0"
indicatif         = "0.17" # TODO  - maybe this might go away or we introduce
colored           = "2.0"  #         a debugging feature  
statistical       = "1.0"  # FIXME - replace this with our own implementation
toml              = "0.8"
#polars            = { version = "0.52", features = ["lazy", "timezones"]}
#pyo3-polars       = { version = "0.25", features = ["dtype-full"]}
env_logger        = "0.10"

# for the database - in case we want to use postgres, 
# the feature needs to be added here, however, this would
# also require libpq to be installed.
#diesel = { version = "2.3", features = ["sqlite", "64-column-tables"]}
# this fixes all compiling issues for the musl target with libsqlite
#libsqlite3-sys = { version = "0.28", features = ["bundled"] }
#libsqlite3-sys = { version = "0.35", features = ["bundled"] }

# for testing / features
rand   = { version = "0.9", optional = true}
